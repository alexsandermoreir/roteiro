<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>Roteiros Japão 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: uma coluna de celular, inspirada nas placas de estação japonesas; o dia vira uma fila de paradas com a próxima em destaque */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --fg:#16181D; --muted:#6A6F7B; --hair:#E1E3EA;
  --accent:#24396B; --accent-ink:#FFFFFF; --soft:#E7EBF4; --done:#A6ABB5;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ja:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101216; --surface:#191C22; --fg:#ECEDF0; --muted:#959BA7; --hair:#2A2E36;
  --accent:#9DB2E8; --accent-ink:#0F1420; --soft:#1E2535; --done:#5B606B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#191C22; --fg:#ECEDF0; --muted:#959BA7; --hair:#2A2E36;
  --accent:#9DB2E8; --accent-ink:#0F1420; --soft:#1E2535; --done:#5B606B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 64px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ja{font-family:var(--ja)}
.muted{color:var(--muted)}

/* Início */
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
.flags{display:flex;gap:6px}
.flag{height:36px;min-width:44px;padding:0 10px;border-radius:18px;font-size:18px;border:1px solid var(--hair);background:var(--surface)}
.flag[aria-pressed="true"]{border-color:var(--fg)}
.flag.txt{font-size:14px;font-weight:600}
.cities{display:grid;gap:12px}
.city{position:relative;display:block;width:100%;text-align:left;border-radius:var(--r);overflow:hidden;
  aspect-ratio:16/9;max-width:100%;background:var(--accent);color:var(--accent-ink);padding:18px}
.city .kanji{position:absolute;right:-6px;bottom:-26px;font:700 120px/1 var(--ja);opacity:.18;letter-spacing:-.04em;pointer-events:none}
.city .name{font-size:26px;font-weight:700;letter-spacing:-.02em;display:flex;gap:8px;align-items:center}
.city .dates{font-size:15px;opacity:.85}
.city .stat{position:absolute;left:18px;bottom:16px;font-size:14px;opacity:.85;font-variant-numeric:tabular-nums}
.city.soon{background:var(--surface);color:var(--fg);border:1px solid var(--hair);cursor:default;aspect-ratio:auto;min-height:92px}
.city.soon .kanji{font-size:72px;bottom:-14px;opacity:.07}
.city.soon .stat{position:static;margin-top:6px;color:var(--muted);opacity:1}

/* Cidade */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;margin-top:-10px}
.bar-row{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;border:1px solid var(--hair);background:var(--surface);flex:none}
.bar-title{font-weight:700;font-size:18px}
.bar-total{margin-left:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:none;width:52px;padding:6px 0;border-radius:12px;text-align:center;border:1px solid var(--hair);background:var(--surface);position:relative}
.dchip b{display:block;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.dchip span{font-size:12px;color:var(--muted)}
.dchip[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dchip[aria-current="true"] span{color:inherit;opacity:.75}
.dchip.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:3px;background:var(--accent)}

.dayhead{margin:18px 0 14px}
.dayhead h2{margin:0;font-size:24px;letter-spacing:-.02em;text-wrap:balance}
.dayhead .sub{color:var(--muted);font-size:15px}
.stats{display:flex;gap:18px;margin-top:10px;font-size:14px;font-variant-numeric:tabular-nums}
.stats b{font-size:17px;display:block}

/* Próxima parada */
.focus{background:var(--surface);border-radius:var(--r);padding:18px;border:1px solid var(--hair);margin-bottom:22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.focus h3{margin:6px 0 0;font-size:26px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.focus .jn{font-size:15px;color:var(--muted);margin-top:2px}
.focus .how{margin-top:14px;padding-top:14px;border-top:1px solid var(--hair)}
.focus p{margin:12px 0 0;font-size:15px}
.acts{display:flex;gap:8px;margin-top:16px}
.btn{height:48px;border-radius:24px;padding:0 20px;font-weight:600;border:1px solid var(--hair);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
.btn.sm{height:38px;padding:0 14px;font-size:14px}

/* Trajeto */
.legline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;font-size:14px}
.to{margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 3px;border-radius:14px;background:var(--c);color:var(--ct);font-weight:700;font-size:13px;letter-spacing:.01em;white-space:nowrap}
.chip.bus{padding-left:12px}
.code{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:#fff;color:#14161A;font:800 11px/1 var(--sans);letter-spacing:0}
.to{color:var(--muted)}
.legmeta{font-size:14px;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.legmeta .muted{font-weight:400}

/* Linha do tempo */
.tl{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:32px 1fr;column-gap:12px}
.rail{display:flex;justify-content:center}
.dot{width:26px;height:26px;border-radius:13px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:10px;font-variant-numeric:tabular-nums}
.dot.home{border-radius:7px;font:700 13px/1 var(--ja)}
.dot.next{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--soft)}
.done .dot{background:var(--hair);color:var(--muted)}
.stop{min-width:0;text-align:left;width:100%;padding:12px 0 10px}
.stop .n{font-weight:600;font-size:17px}
.done .stop .n{color:var(--done);text-decoration:line-through;text-decoration-thickness:1px}
.stop .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.detail{padding-bottom:12px;font-size:15px}
.detail p{margin:0 0 8px}
.detail .acts{margin-top:10px;flex-wrap:wrap}
.leg .rail{position:relative}
.bar-v{width:6px;border-radius:3px;min-height:44px;background:var(--grad)}
.bar-w{width:0;min-height:36px;border-left:2px dotted var(--done)}
.leg .body{padding:8px 0 10px;min-width:0}
.walk{color:var(--muted);font-size:14px}
.note .body{padding:6px 0;font-size:14px;color:var(--muted);font-style:italic}
.note .rail::before{content:"";width:2px;background:var(--hair)}
.alt .body{padding:6px 0 12px}
.alt .label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}

/* Mapa */
details.map{margin-top:22px;border-top:1px solid var(--hair);padding-top:14px}
details.map summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.map summary::-webkit-details-marker{display:none}
details.map summary::after{content:"+";color:var(--muted);font-size:20px;line-height:1}
details.map[open] summary::after{content:"−"}
.mapbox{margin-top:12px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}

/* Japonês em tela cheia */
.jaov{position:fixed;inset:0;z-index:20;background:var(--surface);display:grid;place-items:center;text-align:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.jaov .big{font:700 clamp(36px,11vw,64px)/1.25 var(--ja);word-break:keep-all;overflow-wrap:anywhere}
.jaov .small{margin-top:18px;color:var(--muted)}
.jaov .close{margin-top:32px}

.field{width:100%;max-width:420px;height:48px;border-radius:12px;border:1px solid var(--hair);background:var(--bg);color:var(--fg);padding:0 14px;font:16px var(--ja)}
.vids{display:flex;gap:12px;overflow-x:auto;margin:4px 0 12px;padding-bottom:4px;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.vids::-webkit-scrollbar{display:none}
.vslide{flex:0 0 min(78%,300px);scroll-snap-align:start}
.vtile{position:relative;width:100%;aspect-ratio:9/16;border-radius:12px;overflow:hidden;color:#fff;text-align:left;padding:8px;display:flex;flex-direction:column;justify-content:space-between}
.vtile.tt{background:linear-gradient(160deg,#111 0%,#2b2b2b 60%,#25F4EE33 80%,#FE2C5544 100%)}
.vtile.ig{background:linear-gradient(160deg,#4F5BD5 0%,#962FBF 40%,#D62976 70%,#FA7E1E 100%)}
.plat{font-size:13px;font-weight:700;letter-spacing:.02em}
.play{align-self:center;width:0;height:0;border-left:30px solid #fff;border-top:18px solid transparent;border-bottom:18px solid transparent;opacity:.9}
.vt{font-size:14px;font-weight:600;line-height:1.25;opacity:.9;overflow-wrap:anywhere}
.player{width:100%}
.player iframe{display:block;width:100%;border:0;border-radius:12px;background:#000}
.player.tt iframe{aspect-ratio:9/16}
.player.ig iframe{height:620px;background:var(--surface)}
.pact{display:flex;justify-content:space-between;font-size:14px;padding:8px 2px 0}
.pact button{color:var(--muted)}
.ph{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;margin-bottom:12px;background:var(--soft)}
.focus .ph{margin:-6px 0 14px}
.city{cursor:pointer}
.city.has{background:#000}
.cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.city.has::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 45%,rgba(0,0,0,.55))}
.city.has{color:#fff}
.city.has .kanji{display:none}
.city>.name,.city>.dates{position:relative;z-index:1}
.city .stat{z-index:1}
.cover-edit{position:absolute!important;right:12px;top:12px;z-index:2;height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:600;background:rgba(255,255,255,.18);color:inherit;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{width:100%;max-width:440px;text-align:left}
.sheet h3{margin:4px 0 16px;font-size:22px}
.wide{width:100%}
.or{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 8px}
.linkrow{display:flex;gap:8px}
.linkrow .field{flex:1;min-width:0;font-family:var(--sans)}
.pmsg{min-height:22px;font-size:14px;color:var(--muted);margin-top:8px}
.hint{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.th{width:60px;height:60px;border-radius:12px;object-fit:cover;background:var(--soft);display:block}
.tile{display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--accent)}
.done .th{opacity:.45}
.ph[data-wkb]{min-height:120px}
.credit{display:block;font-size:12px;color:var(--muted);margin:-6px 0 10px;text-decoration:none}
.alldone{text-align:center;padding:8px 0}
@media (prefers-reduced-motion:no-preference){.day{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="jaov" id="jaov" hidden role="dialog" aria-modal="true"></div>

<script src="dados.js"></script>
<script>
/* utilidades */
const $=s=>document.querySelector(s);
const C=()=>view.city;
const money=(n,c=view.city)=>((c&&c.cur)||"¥")+n.toLocaleString("pt-BR");
const addr=()=>{try{const c=view.city;return (c&&(localStorage.getItem("endereco-"+c.id)||(c.id==="toquio"&&localStorage.getItem("endereco"))))||""}catch(e){return ""}};
const dur=m=>m>=60?`${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}`:`${m} min`;
const dist=k=>k<1?`${Math.round(k*1000)} m`:`${k.toLocaleString("pt-BR",{maximumFractionDigits:1})} km`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DOW=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"], DOWS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const dt=s=>new Date(s+"T12:00:00");
const jstToday=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=store.get("feito")||{};

const isStop=i=>i.n||i.home;
const legs=day=>[...day.items.filter(i=>i.leg&&!i.alt).map(i=>i.leg),...(day.end?[day.end]:[])];
const dayFare=day=>legs(day).reduce((s,l)=>s+(l.fare||0),0);
const dayKm=day=>legs(day).reduce((s,l)=>s+(l.km||0),0);
const cityFare=c=>c.days.reduce((s,d)=>s+dayFare(d),0);

const ink=hex=>{const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>150?"#14161A":"#FFFFFF"};
function chip(k){const L=LINES[k];return `<span class="chip${L.bus?" bus":""}" style="--c:${L.c};--ct:${ink(L.c)}">${L.bus?"":`<span class="code">${k}</span>`}${esc(L.n)}</span>`}
function legBody(l){
  if(l.m==="w")return `<div class="walk">${dur(l.min)} a pé, ${dist(l.km)}</div>`;
  if(l.m==="tour")return `<div class="walk">${esc(l.label||"De carro com a agência")}, ${dur(l.min)}</div>`;
  const segs=l.segs.length?l.segs.map(([k,to])=>`${chip(k)}<span class="to">até ${esc(to)}</span>`).join(""):`<span class="walk">Transporte, linhas a definir</span>`;
  const meta=[l.fare!=null?money(l.fare):`<span class="muted">valor a definir</span>`,l.min?dur(l.min):""].filter(Boolean).join(", ");
  return `<div class="legline">${segs}</div><div class="legmeta">${meta}</div>`;
}
function legRail(l){
  if(l.m!=="t"||!l.segs.length)return `<div class="bar-w"></div>`;
  const cs=l.segs.map(([k])=>LINES[k].c);
  const g=cs.length===1?cs[0]:`linear-gradient(${cs.map((c,i)=>`${c} ${i*100/cs.length}% ${(i+1)*100/cs.length}%`).join(",")})`;
  return `<div class="bar-v" style="--grad:${g}"></div>`;
}
const travel=l=>!l?"transit":l.m==="w"?"walking":l.m==="tour"?"driving":"transit";
const query=s=>s.home?(addr()||C().home.q):(s.q||`${s.n}, ${C().area}`);
const goURL=s=>`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(query(s))}&travelmode=${travel(s.leg)}`;
const seeURL=s=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query(s))}`;

/* fotos: salvas neste aparelho (IndexedDB); as fixas vêm do roteiro */
const photos={};
const DB={db:null,
  load(){return new Promise(res=>{try{const r=indexedDB.open("roteiro",1);r.onupgradeneeded=()=>r.result.createObjectStore("fotos");
    r.onsuccess=()=>{this.db=r.result;const tx=this.db.transaction("fotos").objectStore("fotos").openCursor();
      tx.onsuccess=e=>{const cur=e.target.result;if(cur){photos[cur.key]=cur.value.url||URL.createObjectURL(cur.value.blob);cur.continue()}else res()};tx.onerror=()=>res()};
    r.onerror=()=>res()}catch(e){res()}})},
  put(k,v){try{this.db.transaction("fotos","readwrite").objectStore("fotos").put(v,k)}catch(e){}},
  del(k){try{this.db.transaction("fotos","readwrite").objectStore("fotos").delete(k)}catch(e){}}};
const wikiFor=it=>it.home?null:(it.w!==undefined?(it.w||null):(WTERM[it.n]||null));
const WK=(()=>{try{return JSON.parse(localStorage.getItem("wk"))||{}}catch(e){return {}}})();
const saveWK=()=>{try{localStorage.setItem("wk",JSON.stringify(WK))}catch(e){}};
const pend={};
function wq(host,s){return fetch(`https://${host}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch=${encodeURIComponent(s)}&gsrlimit=1&prop=pageimages|info&inprop=url&piprop=thumbnail|name&pithumbsize=900`)
  .then(r=>r.json()).then(d=>{const p=Object.values((d.query||{}).pages||{})[0];return p&&p.thumbnail&&!/logo|\.svg/i.test(p.pageimage||"")?{src:p.thumbnail.source,url:p.fullurl}:null}).catch(()=>undefined)}
function wiki(it){const term=wikiFor(it);if(!term)return Promise.resolve(null);if(term in WK)return Promise.resolve(WK[term]);
  if(!pend[term])pend[term]=wq("en",term).then(r=>r===null&&it.ja?wq(C().wl||"ja",it.ja):r).then(r=>{delete pend[term];if(r!==undefined){WK[term]=r;saveWK()}return r||null});
  return pend[term]}
const wikiOf=it=>{const t=wikiFor(it);return t&&WK[t]?WK[t]:null};
const waiting=it=>{const t=wikiFor(it);return !!t&&!(t in WK)};
const photoOf=(k,it)=>photos[k]||it.img||(wikiOf(it)||{}).src||null;
const tileTxt=it=>esc(((it.home?"家":(it.ja||it.n)).replace(/^(Apple|THE|A PIT|MEGA|SHIBUYA|GINZA|Nintendo|ユニクロ)\s*/,"")).slice(0,2));
const coverOf=c=>photos["capa-"+c.id]||c.cover||null;
function shrink(blob){return new Promise(res=>{const u=URL.createObjectURL(blob),im=new Image();
  im.onload=()=>{const m=1400,r=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*r);cv.height=Math.round(im.height*r);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>res(b||blob),"image/jpeg",.84)};
  im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u})}
function editPhoto(k,name,rerender){
  const o=$("#jaov");let cur=photos[k];
  const close=()=>{o.hidden=true;document.removeEventListener("paste",onPaste);rerender()};
  const setBlob=async b=>{msg("Preparando a imagem…");const sb=await shrink(b);if(!sb)return msg("Esse arquivo não é uma imagem que eu consiga abrir.");
    DB.put(k,{blob:sb});if(photos[k]&&photos[k].startsWith("blob:"))URL.revokeObjectURL(photos[k]);photos[k]=URL.createObjectURL(sb);close()};
  const setLink=u=>{u=u.trim();if(!/^https?:\/\//.test(u))return msg("Cole um link que comece com http.");msg("Abrindo o link…");
    const im=new Image();im.onload=()=>{DB.put(k,{url:u});photos[k]=u;close()};im.onerror=()=>msg("Não consegui abrir essa imagem. Use o link direto da foto, de preferência terminando em .jpg, .png ou .webp.");im.src=u};
  const onPaste=e=>{const items=[...(e.clipboardData||{}).items||[]];const img=items.find(x=>x.type.startsWith("image/"));
    if(img){e.preventDefault();setBlob(img.getAsFile());return}
    const txt=e.clipboardData.getData("text");if(txt&&e.target.id!=="purl"){e.preventDefault();setLink(txt)}};
  o.innerHTML=`<div class="sheet" role="document"><div class="eyebrow">Foto</div><h3>${esc(name)}</h3>
    ${cur||""?`<img class="ph" src="${esc(cur)}" alt="">`:""}
    <label class="btn go wide" for="pfile">Escolher da galeria</label><input id="pfile" type="file" accept="image/*" hidden>
    <div class="or">ou cole a imagem ou o link aqui</div>
    <div class="linkrow"><input id="purl" class="field" type="url" inputmode="url" placeholder="https://…" autocomplete="off"><button class="btn" id="pok">Usar</button></div>
    <div class="pmsg" id="pmsg" aria-live="polite"></div>
    <div class="acts">${cur?`<button class="btn" id="pdel">Remover</button>`:""}<button class="btn" id="pclose" style="margin-left:auto">Fechar</button></div>
    <div class="hint">A foto fica salva só neste aparelho.</div></div>`;
  function msg(t){$("#pmsg").textContent=t}
  o.hidden=false;o.onclick=e=>{if(e.target===o)close()};
  document.addEventListener("paste",onPaste);
  $("#pfile").onchange=e=>{const f=e.target.files[0];if(f)setBlob(f)};
  $("#pok").onclick=()=>setLink($("#purl").value);
  $("#purl").onkeydown=e=>{if(e.key==="Enter")setLink(e.target.value)};
  $("#pclose").onclick=close;
  if(cur)$("#pdel").onclick=()=>{DB.del(k);delete photos[k];close()};
}

/* estado */
let view={city:null,day:0,open:null,filter:"all",vid:null};

function home(){
  const fl=[["all","Todos"],...[...new Set(TRIP.cities.map(c=>c.flag))].map(f=>[f,f])];
  const cities=TRIP.cities.filter(c=>view.filter==="all"||c.flag===view.filter);
  $("#app").innerHTML=`
   <div class="top"><h1>Japão 2026</h1>
    <div class="flags">${fl.map(([v,l])=>`<button class="flag${v==="all"?" txt":""}" aria-pressed="${view.filter===v}" data-f="${v}">${l}</button>`).join("")}</div></div>
   <div class="cities">${cities.map(c=>c.days?`
    <div class="city${coverOf(c)?" has":""}" data-c="${c.id}" role="button" tabindex="0">${coverOf(c)?`<img class="cimg" src="${esc(coverOf(c))}" alt="">`:""}<span class="kanji">${c.kanji}</span>
     <div class="name">${c.flag} ${esc(c.name)}</div><div class="dates">${c.dates}</div>
     <div class="stat">${c.days.length>1?c.days.length+" dias":"1 dia"}${cityFare(c)?`, ${money(cityFare(c),c)} em transporte`:""}</div>
     <button class="cover-edit" data-cover="${c.id}">Foto</button></div>`:`
    <div class="city soon"><span class="kanji ja">${c.kanji}</span>
     <div class="name" style="font-size:20px">${c.flag} ${esc(c.name)}</div><div class="dates muted">${c.dates}</div>
     <div class="stat">Roteiro em breve</div></div>`).join("")}</div>`;
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{view.filter=b.dataset.f;home()});
  document.querySelectorAll("[data-c]").forEach(b=>{b.onclick=e=>{if(!e.target.closest(".cover-edit"))openCity(b.dataset.c)};b.onkeydown=e=>{if(e.key==="Enter")openCity(b.dataset.c)}});
  document.querySelectorAll("[data-cover]").forEach(b=>b.onclick=()=>{const c=TRIP.cities.find(x=>x.id===b.dataset.cover);editPhoto("capa-"+c.id,c.name,home)});
}

function openCity(id,dayIdx){
  const c=TRIP.cities.find(x=>x.id===id);view.city=c;view.open=null;
  const today=jstToday();const ti=c.days.findIndex(d=>d.d===today);
  view.day=dayIdx!=null?dayIdx:(ti>=0?ti:(store.get("dia-"+id)??0));
  try{history.replaceState(null,"","#"+id)}catch(e){}
  city();scrollTo(0,0);
}

function city(){
  const c=view.city,day=c.days[view.day],today=jstToday();
  store.set("dia-"+c.id,view.day);
  const D=dt(day.d);
  const key=i=>`${day.d}-${i}`;
  const nextIdx=day.items.findIndex((it,i)=>isStop(it)&&!done[key(i)]);
  const fare=dayFare(day),alt=day.items.find(i=>i.alt);
  const missing=legs(day).some(l=>l.m==="t"&&l.fare==null);

  let tl="";
  if(day.start)tl+=row("home",`<div class="stop"><div class="n">${esc(c.home.n)}</div><div class="t">${day.depart?esc(day.depart):"Saída"}</div></div>`,"家");
  else if(day.depart)tl+=note(day.depart);
  day.items.forEach((it,i)=>{
    if(it.txt){tl+=note(it.txt);return}
    if(it.alt){tl+=`<li class="row alt"><div class="rail">${legRail(it.leg)}</div><div class="body"><div class="label">${esc(it.alt)}</div>${legBody(it.leg)}</div></li>`;return}
    if(it.leg)tl+=legRow(it.leg);
    const n=it.home?c.home.n:it.n,isDone=!!done[key(i)],num=day.items.slice(0,i+1).filter(x=>x.n).length;
    const open=view.open===i;
    tl+=`<li class="row${isDone?" done":""}"><div class="rail"><div class="dot${it.home?" home":""}${i===nextIdx?" next":""}">${it.home?"家":num}</div></div>
      <div><div class="srow"><button class="stop" data-o="${i}" aria-expanded="${open}"><div class="n">${esc(n)}</div>${it.time||it.info||it.vids?`<div class="t">${esc([it.time,it.info,it.vids?(it.vids.length>1?it.vids.length+" vídeos":"1 vídeo"):""].filter(Boolean).join(", "))}</div>`:""}</button>${open?"":thumb(i,it)}</div>
      ${open?detail(it,i,isDone):""}</div></li>`;
  });
  if(day.end){tl+=legRow(day.end);tl+=row("home",`<div class="stop"><div class="n">${esc(c.home.n)}</div><div class="t">Fim do dia</div></div>`,"家")}

  const nx=day.items[nextIdx];
  const focus=nx?`<section class="focus" aria-label="Próxima parada">${big(nextIdx,nx,false)}
     <div class="eyebrow">${day.d===today?"Agora":"Primeira parada pendente"}</div>
     <h3>${esc(nx.home?c.home.n:nx.n)}</h3>${nx.ja?`<div class="jn ja">${esc(nx.ja)}</div>`:""}
     ${nx.leg?`<div class="how">${legBody(nx.leg)}</div>`:""}
     ${nx.note?`<p>${esc(nx.note)}</p>`:""}
     <div class="acts"><a class="btn go" href="${goURL(nx)}" target="_blank" rel="noopener">Ir</a>
      <button class="btn" data-ja="${nextIdx}" aria-label="Mostrar no idioma local">${c.lang}</button>
      <button class="btn" data-d="${nextIdx}">Feito</button></div></section>`
   :`<section class="focus alldone"><div class="eyebrow">Dia concluído</div><p>Todas as paradas foram marcadas.</p></section>`;

  $("#app").innerHTML=`
   <div class="bar"><div class="bar-row"><button class="back" id="back" aria-label="Voltar">←</button>
     <div class="bar-title">${c.flag} ${esc(c.name)}</div><div class="bar-total">${cityFare(c)?`${money(cityFare(c))} no ${c.card}`:""}</div></div>
    <nav class="days" aria-label="Dias">${c.days.map((d,i)=>{const x=dt(d.d);return `<button class="dchip${d.d===today?" today":""}" aria-current="${i===view.day}" data-day="${i}"><b>${String(x.getDate()).padStart(2,"0")}</b><span>${DOWS[x.getDay()]}</span></button>`}).join("")}</nav></div>
   <div class="day" id="day">
    <div class="dayhead"><h2>${DOW[D.getDay()]}, ${D.getDate()} de novembro</h2><div class="sub">${esc(day.label||"")}</div>
     <div class="stats">${fare||legs(day).some(l=>l.m==="t")?`<div><b>${fare?money(fare):"A definir"}</b><span class="muted">${fare&&missing?"transporte, falta um trecho":"em transporte"}</span></div>`:""}
      <div><b>${dist(dayKm(day))}</b><span class="muted">no total</span></div>
      ${alt?`<div><b>${money(fare-legs(day).find(l=>l.segs&&l.segs[0]&&l.segs[0][0]==="B01").fare+alt.leg.fare)}</b><span class="muted">no plano B</span></div>`:""}</div></div>
    ${focus}
    <ol class="tl">${tl}</ol>
    <details class="map" id="mapd"${store.get("mapa")?" open":""}><summary>Mapa do dia</summary><div class="mapbox">${mapSVG(day)}</div></details>
   </div>`;

  $("#back").onclick=()=>{view.city=null;try{history.replaceState(null,"","#inicio")}catch(e){};home();scrollTo(0,0)};
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{view.day=+b.dataset.day;view.open=null;view.vid=null;city()});
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const i=+b.dataset.o;view.open=view.open===i?null:i;view.vid=null;city()});
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const k=key(+b.dataset.d);if(done[k])delete done[k];else done[k]=1;store.set("feito",done);view.open=null;city()});
  document.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{const i=+b.dataset.ph,it=day.items[i];editPhoto(key(i),it.home?c.home.n:it.n,city)});
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view.vid=b.dataset.v||null;city()});
  document.querySelectorAll("[data-ja]").forEach(b=>b.onclick=()=>showJa(day.items[+b.dataset.ja]));
  $("#mapd").ontoggle=e=>store.set("mapa",e.target.open);
  document.querySelectorAll("[data-wk],[data-wkb]").forEach(el=>{const i=+(el.dataset.wk??el.dataset.wkb),it=day.items[i];
    wiki(it).then(r=>{if(!el.isConnected)return;if(r)el.src=r.src;else if(el.dataset.wk!=null){const d=document.createElement("div");d.className="th tile ja";d.textContent=tileTxt(it);el.replaceWith(d)}else el.remove()})});
  const cur=document.querySelector('.dchip[aria-current="true"]');if(cur)cur.scrollIntoView({inline:"center",block:"nearest"});

  function row(cls,inner,mark){return `<li class="row"><div class="rail"><div class="dot ${cls}">${mark}</div></div><div>${inner}</div></li>`}
  function note(s){return `<li class="row note"><div class="rail"></div><div class="body">${esc(s)}</div></li>`}
  function legRow(l){return `<li class="row leg"><div class="rail">${legRail(l)}</div><div class="body">${legBody(l)}</div></li>`}
  function vids(it,i){
    const n=it.vids.length;
    return `<div class="vids" data-vc="${i}">${it.vids.map(([p,id,title],j)=>{const k=`${i}-${j}`,url=p==="tt"?`https://www.tiktok.com/@/video/${id}`:`https://www.instagram.com/reel/${id}/`;
      const inner=view.vid===k?`<div class="player ${p}"><iframe src="${p==="tt"?`https://www.tiktok.com/player/v1/${id}?description=0&music_info=0&rel=0`:`https://www.instagram.com/reel/${id}/embed`}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen loading="lazy" title="${esc(title)}"></iframe></div>`
        :`<button class="vtile ${p}" data-v="${k}"><span class="plat">${p==="tt"?"TikTok":"Reels"}</span><span class="play" aria-hidden="true"></span><span class="vt">${esc(title)}</span></button>`;
      return `<div class="vslide">${inner}<div class="pact"><a href="${url}" target="_blank" rel="noopener">Abrir no app ↗</a>${n>1?`<span class="muted">${j+1} de ${n}</span>`:""}</div></div>`}).join("")}</div>`;
  }

  function thumb(i,it){const src=photoOf(key(i),it);
    if(src)return `<img class="th" src="${esc(src)}" alt="" loading="lazy">`;
    if(waiting(it))return `<img class="th" data-wk="${i}" alt="">`;
    return `<div class="th tile ja" aria-hidden="true">${tileTxt(it)}</div>`}
  function big(i,it,credit){const src=photoOf(key(i),it),w=!photos[key(i)]&&!it.img?wikiOf(it):null;
    if(src)return `<img class="ph" src="${esc(src)}" alt="">${credit&&w?`<a class="credit" href="${w.url}" target="_blank" rel="noopener">Foto: Wikipedia</a>`:""}`;
    if(waiting(it))return `<img class="ph" data-wkb="${i}" alt="">`;
    return ""}
  function detail(it,i,isDone){
    return `<div class="detail">${big(i,it,true)}${it.ja?`<p class="ja muted">${esc(it.ja)}</p>`:""}${it.note?`<p>${esc(it.note)}</p>`:""}${it.fee?`<p>Ingresso: ${esc(it.fee)}</p>`:""}
     ${it.vids?vids(it,i):""}
     ${(it.links||[]).map(([l,u])=>`<p><a href="${u}" target="_blank" rel="noopener">${esc(l)} ↗</a></p>`).join("")}
     <div class="acts"><a class="btn sm" href="${goURL(it)}" target="_blank" rel="noopener">Ir</a>
      <a class="btn sm" href="${seeURL(it)}" target="_blank" rel="noopener">Fotos</a>
      <button class="btn sm" data-ja="${i}">${c.lang}</button>
      <button class="btn sm" data-ph="${i}">Foto</button>
      <button class="btn sm" data-d="${i}">${isDone?"Desfazer":"Feito"}</button></div></div>`;
  }
}

function showJa(it){
  const o=$("#jaov");
  if(it.home&&!addr()){
    o.innerHTML=`<div><div class="small" style="margin:0 0 14px">O endereço da hospedagem fica salvo só neste aparelho.</div>
     <input id="addr" class="field" placeholder="Cole o endereço da hospedagem" autocomplete="off">
     <div class="acts" style="justify-content:center"><button class="btn go" id="addok">Salvar</button><button class="btn" id="jac">Fechar</button></div></div>`;
    o.hidden=false;$("#addr").focus();o.onclick=null;
    $("#addok").onclick=()=>{const v=$("#addr").value.trim();if(v){try{localStorage.setItem("endereco-"+C().id,v)}catch(e){}}o.hidden=true;if(v)showJa(it)};
    $("#jac").onclick=()=>{o.hidden=true};return;
  }
  o.innerHTML=`<div><div class="big">${esc(it.home?addr():(it.ja||it.n))}</div><div class="small">${esc(it.home?C().home.n:it.n)}</div>
   <button class="btn close" id="jac">Fechar</button></div>`;
  o.hidden=false;$("#jac").focus();
  o.onclick=()=>{o.hidden=true};
}

function mapSVG(day){
  const pts=[];
  const HP=C().home.p;if(day.start)pts.push({p:HP,home:1});
  day.items.forEach(it=>{if(it.n)pts.push({p:it.p,leg:it.leg});else if(it.home)pts.push({p:HP,home:1,leg:it.leg})});
  if(day.end)pts.push({p:HP,home:1,leg:day.end});
  const W=340,H=260,pad=26;
  const lat0=pts.reduce((s,x)=>s+x.p[0],0)/pts.length,k=Math.cos(lat0*Math.PI/180);
  const xs=pts.map(x=>x.p[1]*k),ys=pts.map(x=>-x.p[0]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const s=Math.min((W-2*pad)/((maxx-minx)||.001),(H-2*pad)/((maxy-miny)||.001));
  const ox=(W-(maxx-minx)*s)/2,oy=(H-(maxy-miny)*s)/2;
  const P=i=>[ox+(xs[i]-minx)*s,oy+(ys[i]-miny)*s];
  let lines="",pins="",n=0;
  for(let i=1;i<pts.length;i++){
    const [x1,y1]=P(i-1),[x2,y2]=P(i),l=pts[i].leg||{m:"w"};
    const col=l.m==="t"&&l.segs.length?LINES[l.segs[0][0]].c:"var(--done)";
    lines+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="${l.m==="t"?4:2}" stroke-linecap="round"${l.m==="t"?"":' stroke-dasharray="2 5"'}/>`;
  }
  let homeDrawn=false;
  pts.forEach((x,i)=>{const [cx,cy]=P(i);
    if(x.home){if(homeDrawn)return;homeDrawn=true;pins+=`<rect x="${cx-11}" y="${cy-11}" width="22" height="22" rx="6" fill="var(--fg)"/><text x="${cx}" y="${cy+4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bg)" font-family="var(--ja)">家</text>`}
    else{n++;pins+=`<circle cx="${cx}" cy="${cy}" r="10" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--accent-ink)" font-family="var(--sans)">${n}</text>`}});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa esquemático do dia"><rect width="${W}" height="${H}" fill="var(--surface)"/>${lines}${pins}</svg>`;
}

/* gestos: arrastar para o lado troca o dia */
let sx=0,sy=0;
document.addEventListener("touchstart",e=>{if(!view.city||e.target.closest(".days,.mapbox,.vids"))return sx=null;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{if(!view.city||sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dy)<45){const nd=view.day+(dx<0?1:-1);if(nd>=0&&nd<view.city.days.length){view.day=nd;view.open=null;city();scrollTo(0,0)}}},{passive:true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#jaov").hidden=true});

/* abre direto em hoje durante a viagem */
DB.load().then(function(){
  const today=jstToday(),h=location.hash.slice(1);
  const c=TRIP.cities.find(c=>c.days&&c.days.some(d=>d.d===today));
  if(c)openCity(c.id);else if(h&&TRIP.cities.some(x=>x.id===h&&x.days))openCity(h);else home();
});
</script>
