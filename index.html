<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>roteiro</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: uma coluna de celular, inspirada nas placas de estação japonesas; o dia vira uma fila de paradas com a próxima em destaque */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --fg:#16181D; --muted:#6A6F7B; --hair:#E1E3EA;
  --accent:#24396B; --accent-ink:#FFFFFF; --soft:#E7EBF4; --done:#A6ABB5;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ja:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101216; --surface:#191C22; --fg:#ECEDF0; --muted:#959BA7; --hair:#2A2E36;
  --accent:#9DB2E8; --accent-ink:#0F1420; --soft:#1E2535; --done:#5B606B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#191C22; --fg:#ECEDF0; --muted:#959BA7; --hair:#2A2E36;
  --accent:#9DB2E8; --accent-ink:#0F1420; --soft:#1E2535; --done:#5B606B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 64px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ja{font-family:var(--ja)}
.muted{color:var(--muted)}

/* Início */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.flags{margin-bottom:18px}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
.flags{display:flex;gap:6px}
.flag{height:36px;min-width:44px;padding:0 10px;border-radius:18px;font-size:18px;border:1px solid var(--hair);background:var(--surface)}
.flag[aria-pressed="true"]{border-color:var(--fg)}
.flag.txt{font-size:14px;font-weight:600}
.cities{display:grid;gap:12px}
.city{position:relative;display:block;width:100%;text-align:left;border-radius:var(--r);overflow:hidden;
  aspect-ratio:16/9;max-width:100%;background:var(--accent);color:var(--accent-ink);padding:18px}
.city .kanji{position:absolute;right:-6px;bottom:-26px;font:700 120px/1 var(--ja);opacity:.18;letter-spacing:-.04em;pointer-events:none}
.city .name{font-size:26px;font-weight:700;letter-spacing:-.02em;display:flex;gap:8px;align-items:center}
.city .dates{font-size:15px;opacity:.85}
.city .stat{position:absolute;left:18px;bottom:16px;font-size:14px;opacity:.85;font-variant-numeric:tabular-nums}
.city.soon{background:var(--surface);color:var(--fg);border:1px solid var(--hair);cursor:default;aspect-ratio:auto;min-height:92px}
.city.soon .kanji{font-size:72px;bottom:-14px;opacity:.07}
.city.soon .stat{position:static;margin-top:6px;color:var(--muted);opacity:1}

/* Cidade */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;margin-top:-10px}
.bar-row{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;border:1px solid var(--hair);background:var(--surface);flex:none}
.bar-title{font-weight:700;font-size:18px}
.bar-total{margin-left:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:none;width:52px;padding:6px 0;border-radius:12px;text-align:center;border:1px solid var(--hair);background:var(--surface);position:relative}
.dchip b{display:block;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.dchip span{font-size:12px;color:var(--muted)}
.dchip[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dchip[aria-current="true"] span{color:inherit;opacity:.75}
.dchip.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:3px;background:var(--accent)}

.dayhead{margin:18px 0 14px}
.dayhead h2{margin:0;font-size:24px;letter-spacing:-.02em;text-wrap:balance}
.dayhead .sub{color:var(--muted);font-size:15px}
.stats{display:flex;gap:18px;margin-top:10px;font-size:14px;font-variant-numeric:tabular-nums}
.stats b{font-size:17px;display:block}

/* Próxima parada */
.focus{background:var(--surface);border-radius:var(--r);padding:18px;border:1px solid var(--hair);margin-bottom:22px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.focus h3{margin:6px 0 0;font-size:26px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.focus .jn{font-size:15px;color:var(--muted);margin-top:2px}
.focus .how{margin-top:14px;padding-top:14px;border-top:1px solid var(--hair)}
.focus p{margin:12px 0 0;font-size:15px}
.acts{display:flex;gap:8px;margin-top:16px}
.btn{height:48px;border-radius:24px;padding:0 20px;font-weight:600;border:1px solid var(--hair);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
.btn.sm{height:38px;padding:0 14px;font-size:14px}

/* Trajeto */
.legline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;font-size:14px}
.to{margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 3px;border-radius:14px;background:var(--c);color:var(--ct);font-weight:700;font-size:13px;letter-spacing:.01em;white-space:nowrap}
.chip.bus{padding-left:12px}
.code{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:#fff;color:#14161A;font:800 11px/1 var(--sans);letter-spacing:0}
.to{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:6px;font-size:14px}
.stp{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:baseline}
.stp .sl{font-size:12px;font-weight:600;color:var(--muted)}.stp .sn{font-weight:700;font-size:15px}
.sline{padding-left:2px;border-left:3px solid var(--c);margin-left:5px;padding:2px 0 2px 12px}
.legmeta{font-size:14px;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.legmeta .muted{font-weight:400}

/* Linha do tempo */
.tl{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:32px 1fr;column-gap:12px}
.rail{display:flex;justify-content:center}
.dot{width:26px;height:26px;border-radius:13px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:10px;font-variant-numeric:tabular-nums}
.dot.home{border-radius:7px;font:700 13px/1 var(--ja)}
.dot.next{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--soft)}
.done .dot{background:var(--hair);color:var(--muted)}
.stop{min-width:0;text-align:left;width:100%;padding:12px 0 10px}
.stop .n{font-weight:600;font-size:17px}
.done .stop .n{color:var(--done);text-decoration:line-through;text-decoration-thickness:1px}
.stop .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.detail{padding-bottom:12px;font-size:15px}
.detail p{margin:0 0 8px}
.detail .acts{margin-top:10px;flex-wrap:wrap}
.leg .rail{position:relative}
.bar-v{width:6px;border-radius:3px;min-height:44px;background:var(--grad)}
.bar-w{width:0;min-height:36px;border-left:2px dotted var(--done)}
.leg .body{padding:8px 0 10px;min-width:0}
.walk{color:var(--muted);font-size:14px}
.note .body{padding:6px 0;font-size:14px;color:var(--muted);font-style:italic}
.note .rail::before{content:"";width:2px;background:var(--hair)}
.alt .body{padding:6px 0 12px}
.alt .label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}

/* Mapa */
details.map{margin-top:22px;border-top:1px solid var(--hair);padding-top:14px}
details.map summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.map summary::-webkit-details-marker{display:none}
details.map summary::after{content:"+";color:var(--muted);font-size:20px;line-height:1}
details.map[open] summary::after{content:"−"}
.mapbox{margin-top:12px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}

/* Japonês em tela cheia */
.jaov{position:fixed;inset:0;z-index:20;background:var(--surface);display:grid;place-items:center;text-align:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.jaov .big{font:700 clamp(36px,11vw,64px)/1.25 var(--ja);word-break:keep-all;overflow-wrap:anywhere}
.jaov .small{margin-top:18px;color:var(--muted)}
.jaov .close{margin-top:32px}

.field{width:100%;max-width:420px;height:48px;border-radius:12px;border:1px solid var(--hair);background:var(--bg);color:var(--fg);padding:0 14px;font:16px var(--ja)}
.vids{display:flex;gap:12px;overflow-x:auto;margin:4px 0 12px;padding-bottom:4px;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.vids::-webkit-scrollbar{display:none}
.vslide{flex:0 0 min(78%,300px);scroll-snap-align:start}
.vtile{position:relative;width:100%;aspect-ratio:9/16;border-radius:12px;overflow:hidden;color:#fff;text-align:left;padding:8px;display:flex;flex-direction:column;justify-content:space-between}
.vtile.tt{background:linear-gradient(160deg,#111 0%,#2b2b2b 60%,#25F4EE33 80%,#FE2C5544 100%)}
.vtile.ig{background:linear-gradient(160deg,#4F5BD5 0%,#962FBF 40%,#D62976 70%,#FA7E1E 100%)}
.plat{font-size:13px;font-weight:700;letter-spacing:.02em}
.play{align-self:center;width:0;height:0;border-left:30px solid #fff;border-top:18px solid transparent;border-bottom:18px solid transparent;opacity:.9}
.vt{font-size:14px;font-weight:600;line-height:1.25;opacity:.9;overflow-wrap:anywhere}
.player{width:100%}
.player iframe{display:block;width:100%;border:0;border-radius:12px;background:#000}
.player.tt iframe{aspect-ratio:9/16}
.player.ig iframe{height:620px;background:var(--surface)}
.pact{display:flex;justify-content:space-between;font-size:14px;padding:8px 2px 0}
.pact button{color:var(--muted)}
.ph{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;margin-bottom:12px;background:var(--soft)}
.focus .ph{margin:-6px 0 14px}
.city{cursor:pointer}
.city.has{background:#000}
.cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.city.has::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 45%,rgba(0,0,0,.55))}
.city.has{color:#fff}
.city.has .kanji{display:none}
.city>.name,.city>.dates{position:relative;z-index:1}
.city .stat{z-index:1}
.cover-edit{position:absolute!important;right:12px;top:12px;z-index:2;height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:600;background:rgba(255,255,255,.18);color:inherit;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{width:100%;max-width:440px;text-align:left}
.sheet h3{margin:4px 0 16px;font-size:22px}
.wide{width:100%}
.or{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 8px}
.linkrow{display:flex;gap:8px}
.linkrow .field{flex:1;min-width:0;font-family:var(--sans)}
.pmsg{min-height:22px;font-size:14px;color:var(--muted);margin-top:8px}
.hint{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.th{width:88px;height:88px;border-radius:14px;object-fit:cover;background:var(--soft);display:block}
.tile{display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--accent)}
.done .th{opacity:.45}
.ph[data-wkb]{min-height:120px}
.credit{display:block;font-size:12px;color:var(--muted);margin:-6px 0 10px;text-decoration:none}
.tools{display:flex;gap:2px;flex:none}
.iconbtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--muted)}
.iconbtn[aria-pressed="true"]{color:var(--accent);background:var(--soft)}
.bar-total+.tools{margin-left:4px}
.bar-total:empty+.tools{margin-left:auto}
.btn.edit{border-style:dashed}
.jaov.sheetmode{place-items:start center;overflow-y:auto;text-align:left;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}.jaov.sheetmode .sheet{padding-bottom:70px}
.sheet .set{border-top:1px solid var(--hair);padding:14px 0}
.sheet .lbl{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
.hint.left{text-align:left;margin:0 0 10px;display:block}
.seg{display:flex;border:1px solid var(--hair);border-radius:12px;overflow:hidden}
.seg button{flex:1;height:42px;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.tog input{width:22px;height:22px;accent-color:var(--accent)}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair)}
.vrow:last-of-type{margin-bottom:14px}
.vtag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;color:#fff;background:#111}
.vtag.ig{background:#C13584}
.vname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;max-width:calc(100% - 32px);
  background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast button{font-weight:700;color:inherit;text-decoration:underline}
.gtabs{margin:16px 0 14px}
.gtabs button{font-size:13px}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--soft);color:var(--accent);font-size:11px;font-weight:700;vertical-align:1px}
.gtabs button[aria-pressed="true"] .cnt{background:var(--bg);color:var(--fg)}
.gcard{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.gcard p{margin:0;font-size:15px}
.gcard .ph{margin-bottom:10px}
.maplink{display:inline-block;margin-top:8px;font-size:14px;font-weight:600}
.gx{display:block;margin-top:8px;font-size:13px;color:var(--muted);text-decoration:underline}
.pact .gx{display:inline;margin:0}
.empty{color:var(--muted);font-size:15px;margin:6px 0 14px}
.gform{display:grid;gap:8px;border-top:1px dashed var(--hair);padding-top:14px;margin-top:6px}
.field.area{height:auto;padding:12px 14px;font-family:var(--sans);resize:vertical}
.guidebtn{margin-top:10px;gap:8px}
.cover-edit{display:inline-flex;align-items:center;gap:6px}
.phwrap{position:relative}
.phcam{position:absolute;right:10px;bottom:22px;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.focus .phcam{bottom:24px}
.addph{gap:6px;margin-bottom:12px}
.pres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.pres .hint{grid-column:1/-1}
.pick{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft)}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.who{font-weight:600;margin-bottom:4px;overflow-wrap:anywhere}
h1,h2,h3,.eyebrow,.lbl,.btn,.bar-title,.city .name,.city .dates,.city .stat,.dchip span,.seg button,.flag,.stats span,.stats b,.stop .n,.stop .t,
.cover-edit,.plat,.vt,.chip,.walk,.toast,.or,.hint,.dayhead .sub,details.map summary,.legmeta,.to,.empty,.gx,.maplink,.pact a,.credit,.tog span,.pmsg,.label{text-transform:lowercase}
.code,.ja{text-transform:none}
.mark{font-size:40px;font-weight:700;letter-spacing:-.045em;line-height:1}
.mark::after{content:".";color:var(--accent)}
.top .back{margin-right:10px}
.top h1{flex:1;min-width:0}
.trips{display:grid;gap:12px;margin-top:22px}
.trip{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--accent);color:var(--accent-ink);padding:20px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end}
.trip.has{background:#000;color:#fff}
.trip.has::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,0) 40%,rgba(0,0,0,.6))}
.trip>*:not(.cimg){position:relative;z-index:1}
.tname{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.05}
.tmeta{font-size:15px;opacity:.85;margin-top:4px;text-transform:lowercase}
.tbtns{position:absolute!important;top:12px;right:12px;display:flex;gap:6px}
.tbtns .cover-edit{position:static!important}
.newtrip{height:64px;border-radius:var(--r);border:1.5px dashed var(--hair);color:var(--muted);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.newtrip span{font-size:22px;line-height:1}
.emptytrip{padding:28px 4px;text-align:center}
.emptytrip p{margin:0 0 6px}
.alldone{text-align:center;padding:8px 0}
@media (prefers-reduced-motion:no-preference){.day{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}

.ic{flex:none;vertical-align:-3px}
.mapframe{width:100%;height:46vh;min-height:280px;border:1px solid var(--hair);border-radius:14px;margin-top:12px;background:var(--soft)}
.mapframe.wait{display:grid;place-items:center;color:var(--muted)}
.gh{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}.gh h3{margin:2px 0 4px}.gh .eyebrow{display:flex;gap:6px;align-items:center}
.gchips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}.gchips::-webkit-scrollbar{display:none}
.gchip{flex:none;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--hair);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--fg);background:var(--surface)}
.gchip i{font-style:normal;color:var(--muted);font-weight:500}
.gchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}.gchip[aria-pressed="true"] i{color:inherit;opacity:.7}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;grid-auto-flow:dense;margin:0 -2px 90px}
.gt{position:relative;aspect-ratio:1;overflow:hidden;background:var(--soft);display:flex;align-items:flex-end;text-align:left;padding:0;color:var(--fg);border-radius:4px}
.gt.big{grid-column:span 2;grid-row:span 2}
.gt.paper{background:#fff1a8;color:#3b3300;align-items:flex-start;box-shadow:inset 0 -14px 18px -16px rgba(0,0,0,.18)}
.gt.paper .ptxt{padding:10px 10px 8px;font-size:12.5px;line-height:1.35;font-weight:500;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;text-align:left;white-space:pre-wrap}
.gt.paper.big .ptxt{font-size:15px;-webkit-line-clamp:12;padding:14px}
.gbadge.pb{color:#3b3300;opacity:.55;top:auto;bottom:6px;right:6px}
.gt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gt.hasimg::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.6))}
.gt.hasimg .gtxt{color:#fff;z-index:1}
.gtxt{position:relative;padding:7px 8px;font-size:12px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gglyph{position:absolute;top:50%;left:50%;transform:translate(-50%,-70%);color:var(--muted)}
.gbadge{position:absolute;top:6px;right:6px;z-index:2;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.gfab{position:fixed;right:max(18px,calc(50% - 202px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:28px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:25}
.gempty{text-align:center;padding:40px 10px;color:var(--muted)}.gempty p{margin:10px 0}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tbtn{aspect-ratio:1.15;border:1px solid var(--hair);border-radius:16px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:var(--surface);color:var(--fg)}
.gm{margin-top:12px;border-radius:14px;overflow:hidden;background:#000}.gm iframe{display:block;width:100%;border:0}
.gm.tt iframe,.gm.ig iframe{height:560px}.gm.yt iframe{aspect-ratio:16/9;height:auto}
.gm.open{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;height:160px;color:#fff;text-decoration:none}
.gvimg{width:100%;border-radius:14px;margin-top:12px;display:block}
.gvinfo{padding:14px 0 4px}.gvtype{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.gvinfo h4{margin:8px 0 4px;font-size:18px}.gvtext{margin:8px 0;line-height:1.5;white-space:pre-wrap}.gvprice{font-weight:700;margin:6px 0}
.coords{display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;margin-top:8px}
.ficha{border:1px solid var(--hair);border-radius:14px;margin:10px 0;padding:2px 14px}
.fr{display:grid;grid-template-columns:96px 1fr auto;gap:10px;padding:11px 0;border-top:1px solid var(--hair);font-size:15px;align-items:center}.fr:first-child{border-top:0}
.fr>span{color:var(--muted);font-size:13px}.fr>div{min-width:0;overflow-wrap:anywhere}
.fr.h .hbtns{display:flex;gap:6px;align-items:center}.fr:not(.h){grid-template-columns:96px 1fr}
.lbl2{display:block;font-size:13px;font-weight:600;color:var(--muted)}.lbl2 .field{margin-top:6px;display:block}
.frm{display:flex;flex-direction:column;gap:10px;margin-top:12px}.frm .field{max-width:none}
.prevw{max-width:100%;max-height:200px;border-radius:12px}
.seg.rseg{margin-top:14px}
.lmap{height:58vh;min-height:320px;width:100%;z-index:0}
.pin{width:28px;height:28px;border-radius:14px;background:var(--accent,#24396B);color:var(--accent-ink,#fff);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center;font:700 13px system-ui,sans-serif}
.pin.home{background:#111;color:#fff;border-radius:9px}
.pinwrap{background:none;border:0}
.leaflet-container{font-family:inherit}.leaflet-control-attribution{font-size:10px!important}.leaflet-container img{max-width:none!important}details.paste{border:1px solid var(--hair);border-radius:12px;padding:10px 12px;margin:10px 0}details.paste summary{font-weight:600;font-size:14px;cursor:pointer}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.segrow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:center}.segrow .field{height:42px;padding:0 8px;font-size:14px;min-width:0}.leaflet-popup-content{margin:12px 14px}.pbtn{margin-top:8px;height:34px}
</style>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="jaov" id="jaov" hidden role="dialog" aria-modal="true"></div>
<div class="jaov" id="ov2" hidden role="dialog" aria-modal="true" style="z-index:30"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* utilidades */
const $=s=>document.querySelector(s);
const C=()=>view.city;
const money=(n,c=view.city)=>((c&&c.cur)||"¥")+n.toLocaleString("pt-BR");
const addr=()=>{try{const c=view.city;return (c&&(localStorage.getItem("endereco-"+c.id)||(c.id==="toquio"&&localStorage.getItem("endereco"))))||""}catch(e){return ""}};
const dur=m=>m>=60?`${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}`:`${m} min`;
const dist=k=>k<1?`${Math.round(k*1000)} m`:`${k.toLocaleString("pt-BR",{maximumFractionDigits:1})} km`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DOW=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"], DOWS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const dt=s=>new Date(s+"T12:00:00");
const jstToday=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=store.get("feito")||{};

const isStop=i=>i.n||i.home;
/* ===== edição de paradas: editar, incluir, apagar, mover ===== */
const EFFC=new WeakMap();
function effDay(c,day){
  const dk=c.id+"|"+day.d,sig=JSON.stringify([ED.item||{},(ED.novos||{})[dk]||[],(ED.dels||{})[dk]||[],(ED.ordem||{})[dk]||null]),hit=EFFC.get(day);
  if(hit&&hit.sig===sig)return hit.val;
  const dels=(ED.dels||{})[dk]||[],nov=(ED.novos||{})[dk]||[],ord=(ED.ordem||{})[dk];
  let L=day.items.map((it,i)=>{const o={...it,_k:String(i)};if(it.n||it.home)o._n=it.home?"home":it.n;
    const ov=o._n&&(ED.item||{})[dk+"|"+o._n];if(ov)Object.assign(o,ov);return o}).filter(x=>!dels.includes(x._k));
  nov.forEach(nv=>{const o={...nv.item,_k:nv.id,_n:nv.id,novo:1},ov=(ED.item||{})[dk+"|"+nv.id];if(ov)Object.assign(o,ov);
    const at=nv.after===""?-1:L.findIndex(x=>x._k===nv.after);if(nv.after!==""&&at<0)L.push(o);else L.splice(at+1,0,o)});
  if(ord&&ord.length)L=L.map((x,i)=>({x,i,o:ord.indexOf(x._k)})).sort((a,b)=>(a.o<0?1e6+a.i:a.o)-(b.o<0?1e6+b.i:b.o)).map(z=>z.x);
  L.forEach(x=>ensureLines(x.leg));ensureLines(day.end);
  const val={...day,items:L};EFFC.set(day,{sig,val});return val}
const legOf=f=>{const mode=f.mode;if(!mode||mode==="none")return null;const min=+f.min||0,km=+f.km||0;
  if(mode==="w")return {m:"w",min,km};if(mode==="tour")return {m:"tour",min,km,label:f.label||"De carro com a agência"};
  const segs=(f.segs||[]).filter(s=>s.k&&LINES[s.k]).map(s=>s.x?[s.k,s.to||"",s.f||"",s.x]:s.f?[s.k,s.to||"",s.f]:[s.k,s.to||""]);
  return {m:"t",min,km,fare:f.fare===""||f.fare==null?null:+f.fare,segs}};
function editStop(c,day,it,afterK){
  const isNew=!it,home=it&&it.home,dk=c.id+"|"+day.d;
  const f={n:it?(it.n||""):"",ja:it?(it.ja||""):"",time:it?(it.time||""):"",info:it?(it.info||""):"",note:it?(it.note||""):"",fee:it?(it.fee||""):"",
    p:it&&it.p?it.p.join(", "):"",mode:"none",min:"",km:"",fare:"",segs:[],label:"",after:afterK==null?(day.items.length?day.items[day.items.length-1]._k:""):afterK};
  const lg=it&&it.leg;if(lg){f.mode=lg.m;f.min=lg.min||"";f.km=lg.km||"";if(lg.m==="t"){f.fare=lg.fare==null?"":lg.fare;f.segs=(lg.segs||[]).map(([k,to,fr,x])=>({k,to,f:fr||"",x}))}if(lg.m==="tour")f.label=lg.label||""}
  const lineOpts=Object.keys(LINES).map(k=>`<option value="${k}">${k} ${esc(LINES[k].n)}</option>`).join("");
  const close=sheet("<div id=\"ebox\"></div>",()=>{city()});
  let confirmDel=false;
  const draw=()=>{
    const stops=day.items.filter(isStop);
    $("#ebox").innerHTML=`<div class="gh"><div style="flex:1;min-width:0"><div class="eyebrow">${isNew?"nova parada":"editar parada"}</div><h3>${esc(home?c.home.n:(f.n||"sem nome"))}</h3></div><button class="iconbtn" id="ex" aria-label="fechar">${ico("x",20)}</button></div>
    <div class="frm">
    ${home?"":`<label class="lbl2">nome<input class="field" data-e="n" value="${esc(f.n)}" autocomplete="off"></label>
     <label class="lbl2">no idioma local (${esc(c.lang||"")})<input class="field ja" data-e="ja" value="${esc(f.ja)}" autocomplete="off"></label>
     <div class="two"><label class="lbl2">horário<input class="field" data-e="time" value="${esc(f.time)}" placeholder="ex: 16h" autocomplete="off"></label>
      <label class="lbl2">ingresso<input class="field" data-e="fee" value="${esc(f.fee)}" placeholder="ex: ¥2.200" autocomplete="off"></label></div>
     <label class="lbl2">funcionamento ou info<input class="field" data-e="info" value="${esc(f.info)}" placeholder="ex: 9h às 21h" autocomplete="off"></label>
     <label class="lbl2">nota<textarea class="field area" rows="2" data-e="note">${esc(f.note)}</textarea></label>
     <label class="lbl2">coordenadas ou link do google maps<input class="field" data-e="p" value="${esc(f.p)}" placeholder="35.6595, 139.7005" autocomplete="off" autocapitalize="off"></label>
     <div class="acts" style="margin:0"><button class="btn sm" id="egeo">achar pelo nome</button><span class="hint left" id="egi" style="margin:0"></span></div>`}
     <div class="lbl" style="margin:10px 0 0">como chegar até aqui</div>
     <div class="seg">${[["none","sem trecho"],["w","a pé"],["t","transporte"],["tour","carro"]].map(([v,l])=>`<button data-mode="${v}" aria-pressed="${f.mode===v}">${l}</button>`).join("")}</div>
     ${f.mode!=="none"?`<div class="two"><label class="lbl2">minutos<input class="field" inputmode="numeric" data-e="min" value="${esc(f.min)}"></label><label class="lbl2">km<input class="field" inputmode="decimal" data-e="km" value="${esc(f.km)}"></label></div>`:""}
     ${f.mode==="t"?`<label class="lbl2">valor em ienes<input class="field" inputmode="numeric" data-e="fare" value="${esc(f.fare)}" placeholder="ex: 350"></label>
      ${f.segs.map((s,i)=>`<div class="segrow"><select class="field" data-sk="${i}"><option value="">linha</option>${lineOpts.replace(`value="${s.k}"`,`value="${s.k}" selected`)}</select>
        <input class="field" data-sf="${i}" value="${esc(s.f||"")}" placeholder="embarque${i?" (opcional)":""}" autocomplete="off"><input class="field" data-st="${i}" value="${esc(s.to||"")}" placeholder="desça em" autocomplete="off"><button class="gx" data-srm="${i}" aria-label="remover linha">${ico("x",16)}</button></div>`).join("")}
      <div class="acts" style="margin:0"><button class="btn sm" id="eaddseg">+ linha</button></div>`:""}
     ${f.mode==="tour"?`<label class="lbl2">descrição<input class="field" data-e="label" value="${esc(f.label)}" autocomplete="off"></label>`:""}
     ${isNew?`<label class="lbl2">inserir depois de<select class="field" data-e="after"><option value="">no início do dia</option>${day.items.filter(isStop).map(x=>`<option value="${x._k}"${f.after===x._k?" selected":""}>${esc(x.home?c.home.n:x.n)}</option>`).join("")}</select></label>`:""}
    </div><div class="pmsg" id="pmsg" aria-live="polite"></div>
    <div class="acts" style="flex-wrap:wrap"><button class="btn go" id="esave" style="flex:1">salvar</button>
     ${isNew||home?"":`<button class="btn sm" id="eup" aria-label="mover para cima">subir</button><button class="btn sm" id="edown" aria-label="mover para baixo">descer</button><button class="btn sm" id="edel">${confirmDel?"toque de novo para apagar":"apagar"}</button>`}</div>`;
    bind()};
  const grab=()=>{document.querySelectorAll("#ebox [data-e]").forEach(e=>f[e.dataset.e]=e.value);
    document.querySelectorAll("#ebox [data-sk]").forEach(e=>f.segs[+e.dataset.sk].k=e.value);
    document.querySelectorAll("#ebox [data-sf]").forEach(e=>f.segs[+e.dataset.sf].f=e.value.trim());
    document.querySelectorAll("#ebox [data-st]").forEach(e=>f.segs[+e.dataset.st].to=e.value.trim())};
  const msg=t=>{const e=$("#pmsg");if(e)e.textContent=t};
  const geo=async()=>{grab();if(!f.n.trim())return msg("escreva o nome primeiro.");const gi=$("#egi");if(gi)gi.textContent="buscando…";
    try{const r=await Promise.race([fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+enc(f.n+", "+c.area)).then(r=>r.json()),new Promise((_,j)=>setTimeout(j,6000))]);
      if(r&&r[0]){f.p=(+r[0].lat).toFixed(5)+", "+(+r[0].lon).toFixed(5);draw();const g=$("#egi");if(g)g.textContent="achei, confira no mapa depois.";return true}
      if(gi)gi.textContent="não achei, cole um link do google maps."}catch(e){if(gi)gi.textContent="sem resposta, cole um link do google maps."}return false};
  const bind=()=>{
    $("#ex").onclick=close;
    document.querySelectorAll("#ebox [data-mode]").forEach(b=>b.onclick=()=>{grab();f.mode=b.dataset.mode;if(f.mode==="t"&&!f.segs.length)f.segs.push({k:"",to:"",f:""});draw()});
    document.querySelectorAll("#ebox [data-srm]").forEach(b=>b.onclick=()=>{grab();f.segs.splice(+b.dataset.srm,1);draw()});
    const as=$("#eaddseg");if(as)as.onclick=()=>{grab();f.segs.push({k:"",to:"",f:""});draw()};
    const g=$("#egeo");if(g)g.onclick=geo;
    $("#esave").onclick=async()=>{grab();
      if(!home&&!f.n.trim())return msg("dê um nome para a parada.");
      let p=null;if(!home&&f.p.trim()){p=parseMapsLink(f.p)||parseCoords(f.p);if(!p)return msg("não entendi as coordenadas. use 35.6595, 139.7005 ou um link do google maps.")}
      if(!home&&!p&&isNew){msg("procurando as coordenadas…");await geo();p=parseCoords(f.p)}
      const v={leg:legOf(f)};if(!home){Object.assign(v,{n:f.n.trim(),ja:f.ja.trim(),time:f.time.trim(),info:f.info.trim(),note:f.note.trim(),fee:f.fee.trim(),p:p||null})}
      if(isNew){const id="n"+Date.now().toString(36);await saveOps([{t:"it+",d:dk,v:{id,after:f.after,item:v}}])}
      else if(it.novo){const nv=((ED.novos||{})[dk]||[]).find(x=>x.id===it._k);await saveOps([{t:"it+",d:dk,v:{id:it._k,after:nv?nv.after:"",item:v}}])}
      else await saveOps([{t:"it",k:dk+"|"+it._n,v}]);
      close()};
    const mv=async dir=>{const ks=day.items.map(x=>x._k),i=ks.indexOf(it._k);let j=i+dir;while(j>=0&&j<ks.length&&!isStop(day.items[j]))j+=dir;if(j<0||j>=ks.length)return msg("já está no "+(dir<0?"início":"fim")+".");
      [ks[i],ks[j]]=[ks[j],ks[i]];await saveOps([{t:"ord",d:dk,keys:ks}]);close()};
    const u=$("#eup");if(u)u.onclick=()=>mv(-1);const dn=$("#edown");if(dn)dn.onclick=()=>mv(1);
    const de=$("#edel");if(de)de.onclick=async()=>{if(!confirmDel){grab();confirmDel=true;draw();return}await saveOps([{t:"it-",d:dk,k:it._k}]);close()}};
  draw()}

const legs=day=>[...day.items.filter(i=>i.leg&&!i.alt).map(i=>i.leg),...(day.end?[day.end]:[])];
const dayFare=day=>legs(day).reduce((s,l)=>s+(l.fare||0),0);
const dayKm=day=>legs(day).reduce((s,l)=>s+(l.km||0),0);
const cityFare=c=>c.days.reduce((s,d)=>s+dayFare(effDay(c,d)),0);

const ink=hex=>{const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>150?"#14161A":"#FFFFFF"};
function chip(k){const L=LINES[k];return `<span class="chip${L.bus?" bus":""}" style="--c:${L.c};--ct:${ink(L.c)}">${L.bus?"":`<span class="code">${L.code||k}</span>`}${esc(L.n)}</span>`}
const LEGCTX=new WeakMap();
function buildCtx(c){const hs=(hosp(c).estacao||c.home.sta||"").trim()||null;c.days.map(d=>effDay(c,d)).forEach(day=>{let last=day.start?hs:null,prev=day.start?c.home.n:null;
  const st=l=>l&&l.m==="t"&&l.segs&&l.segs.length?l.segs[l.segs.length-1][1]:null;
  day.items.forEach(it=>{if(it.leg)LEGCTX.set(it.leg,{from:last,prev});
    if(it.n||it.home){prev=it.home?c.home.n:it.n;last=it.home?(st(it.leg)||hs):st(it.leg)}});
  if(day.end)LEGCTX.set(day.end,{from:last,prev})})}
function legBody(l){
  if(l.m==="w")return `<div class="walk">${dur(l.min)} a pé, ${dist(l.km)}</div>`;
  if(l.m==="tour")return `<div class="walk">${esc(l.label||"De carro com a agência")}, ${dur(l.min)}</div>`;
  const cx=LEGCTX.get(l)||{};
  const bus=l.segs.length&&LINES[l.segs[0][0]].bus;
  const stp=(lab,name,note)=>`<div class="stp"><span class="sl">${lab}</span><span class="sn">${name?esc(name):`<span class="muted">${bus?"ponto de ônibus":"estação"} perto de ${esc(cx.prev||"aqui")}</span>`}</span></div>`;
  let segs="";
  if(!l.segs.length)segs=`<span class="walk">Transporte, linhas a definir</span>`;
  else{segs=`<div class="steps">`;
    l.segs.forEach(([k,to,fr],i)=>{const from=i===0?(fr||cx.from):(fr||l.segs[i-1][1]);
      if(i===0)segs+=stp("embarque",from);
      segs+=`<div class="sline" style="--c:${LINES[k].c}">${chip(k)}</div>`;
      segs+=stp(i<l.segs.length-1?"baldeação":"desça",to)});
    segs+=`</div>`}
  const meta=[l.fare!=null?money(l.fare):`<span class="muted">valor a definir</span>`,l.min?dur(l.min):""].filter(Boolean).join(", ");
  return `<div class="legline">${segs}</div><div class="legmeta">${meta}</div>`;
}
function legRail(l){
  if(l.m!=="t"||!l.segs.length)return `<div class="bar-w"></div>`;
  const cs=l.segs.map(([k])=>LINES[k].c);
  const g=cs.length===1?cs[0]:`linear-gradient(${cs.map((c,i)=>`${c} ${i*100/cs.length}% ${(i+1)*100/cs.length}%`).join(",")})`;
  return `<div class="bar-v" style="--grad:${g}"></div>`;
}
const travel=l=>!l?"transit":l.m==="w"?"walking":l.m==="tour"?"driving":"transit";
const query=s=>s.home?(addr()||C().home.q):(s.q||`${s.n}, ${C().area}`);
const goURL=s=>`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(query(s))}&travelmode=${travel(s.leg)}`;
const seeURL=s=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query(s))}`;

/* fotos: salvas neste aparelho (IndexedDB); as fixas vêm do roteiro */
const photos={};
const DB={db:null,
  load(){return new Promise(res=>{try{const r=indexedDB.open("roteiro",1);r.onupgradeneeded=()=>r.result.createObjectStore("fotos");
    r.onsuccess=()=>{this.db=r.result;const tx=this.db.transaction("fotos").objectStore("fotos").openCursor();
      tx.onsuccess=e=>{const cur=e.target.result;if(cur){photos[cur.key]=cur.value.url||URL.createObjectURL(cur.value.blob);cur.continue()}else res()};tx.onerror=()=>res()};
    r.onerror=()=>res()}catch(e){res()}})},
  put(k,v){try{this.db.transaction("fotos","readwrite").objectStore("fotos").put(v,k)}catch(e){}},
  del(k){try{this.db.transaction("fotos","readwrite").objectStore("fotos").delete(k)}catch(e){}}};
const wikiFor=it=>it.home?null:(it.w!==undefined?(it.w||null):(WTERM[it.n]||null));
const WK=(()=>{try{return JSON.parse(localStorage.getItem("wk"))||{}}catch(e){return {}}})();
const saveWK=()=>{try{localStorage.setItem("wk",JSON.stringify(WK))}catch(e){}};
const pend={};

      const j=await (await fetch(`https://${m[1]}.wikipedia.org/api/rest_v1/page/summary/${x.pathname.slice(6)}`)).json();const im=(j.originalimage||j.thumbnail||{}).source;if(im)return im}
    if(/(^|\.)(commons\.)?wikimedia\.org$|wikipedia\.org$/.test(h)&&/\/wiki\/(File|Ficheiro|Arquivo):/i.test(x.pathname)){
      const t=decodeURIComponent(x.pathname.split("/wiki/")[1]);const j=await (await fetch("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url&iiurlwidth=1600&titles="+encodeURIComponent(t.replace(/^(Ficheiro|Arquivo):/i,"File:")))).json();

   :`<section class="focus alldone"><div class="eyebrow">Dia concluído</div><p>Todas as paradas foram marcadas.</p></section>`;

  $("#app").innerHTML=`
   <div class="bar"><div class="bar-row"><button class="back" id="back" aria-label="Voltar">←</button>
     <div class="bar-title">${c.flag} ${esc(c.name)}</div><div class="bar-total">${cityFare(c)?`${money(cityFare(c))} no ${c.card}`:""}</div>${tools()}</div>
    <nav class="days" aria-label="Dias">${c.days.map((d,i)=>{const x=dt(d.d);return `<button class="dchip${d.d===today?" today":""}" aria-current="${i===view.day}" data-day="${i}"><b>${String(x.getDate()).padStart(2,"0")}</b><span>${DOWS[x.getDay()]}</span></button>`}).join("")}</nav></div>
   <div class="day" id="day">
    <div class="dayhead"><h2>${DOW[D.getDay()]}, ${D.getDate()} de novembro</h2><div class="sub">${esc(day.label||"")}</div>
     <div class="stats">${fare||legs(day).some(l=>l.m==="t")?`<div><b>${fare?money(fare):"A definir"}</b><span class="muted">${fare&&missing?"transporte, falta um trecho":"em transporte"}</span></div>`:""}
      <div><b>${dist(dayKm(day))}</b><span class="muted">no total</span></div>
      ${alt?`<div><b>${money(fare-legs(day).find(l=>l.segs&&l.segs[0]&&l.segs[0][0]==="B01").fare+alt.leg.fare)}</b><span class="muted">no plano B</span></div>`:""}</div></div>
    ${focus}
    <ol class="tl">${tl}</ol>
    ${view.edit?`<div class="acts" style="margin:6px 0 0"><button class="btn" id="addstop">${ico("plus",16)} nova parada</button></div>`:""}
    <details class="map" id="mapd"${store.get("mapa")?" open":""}><summary>Mapa do dia</summary><div id="mapreal" class="mapbox"></div></details>
   </div>`;

  $("#back").onclick=()=>{view.city=null;try{history.replaceState(null,"","#"+CUR.id)}catch(e){};home();scrollTo(0,0)};
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{view.day=+b.dataset.day;view.open=null;view.vid=null;city()});
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const i=+b.dataset.o;view.open=view.open===i?null:i;view.vid=null;city()});
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const k=key(+b.dataset.d);if(done[k])delete done[k];else done[k]=1;store.set("feito",done);view.open=null;city()});
  document.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{const it=day.items[+b.dataset.ph];editPhoto(ek(it),it.home?c.home.n:it.n,city,wikiFor(it)||`${it.n} ${c.area}`)});
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const i=+b.dataset.r;routeSheet(c,day.items[i],prevStop(day,i),day)});
  document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>hospSheet(c));
  document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>editStop(c,day,day.items[+b.dataset.ed]));
  const as=$("#addstop");if(as)as.onclick=()=>editStop(c,day,null);
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const it=day.items[+b.dataset.g];guide(c,it,ek(it),it.home?c.home.n:it.n)});
  bindTools();
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view.vid=b.dataset.v||null;city()});
  document.querySelectorAll("[data-ja]").forEach(b=>b.onclick=()=>showJa(day.items[+b.dataset.ja]));
  const dayMap=async()=>{const box=$("#mapreal");if(!box)return;
    if(box.dataset.on){if(box._m)setTimeout(()=>box._m.invalidateSize(),50);return}box.dataset.on="1";
    const P=[];let n=0;
    if(day.start)P.push({p:hospP(c),home:1,t:c.home.n});
    day.items.forEach(x=>{if(x.home)P.push({p:hospP(c),home:1,t:c.home.n,leg:x.leg,it:x});else if(x.n){n++;if(x.p)P.push({p:x.p,num:n,t:x.n,leg:x.leg,it:x})}});
    if(day.end)P.push({p:hospP(c),home:1,t:c.home.n,leg:day.end});
    if(P.length<2){box.innerHTML="";return}
    box.innerHTML='<div class="hint left" style="padding:16px">carregando mapa…</div>';
    try{if(!window.L){if(!document.getElementById("lfcss")){const l=document.createElement("link");l.id="lfcss";l.rel="stylesheet";l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css";await new Promise(r=>{l.onload=r;l.onerror=r;document.head.appendChild(l);setTimeout(r,4000)})}
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js")}}
    catch(e){box.innerHTML='<div class="hint left" style="padding:16px">não consegui carregar o mapa agora.</div>';box.dataset.on="";return}
    box.innerHTML='<div id="lmap" class="lmap"></div>';
    const m=box._m=L.map("lmap",{zoomControl:false,attributionControl:false,tap:true});
    L.control.zoom({position:"bottomright"}).addTo(m);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(m);L.control.attribution({prefix:false}).addAttribution("© OpenStreetMap").addTo(m);
    for(let i=1;i<P.length;i++){const l=P[i].leg||{m:"w"},tr=l.m==="t"&&l.segs&&l.segs.length;
      L.polyline([P[i-1].p,P[i].p],{color:tr?LINES[l.segs[0][0]].c:"#6b7280",weight:tr?5:3,opacity:.9,dashArray:tr?null:"2 7",lineCap:"round"}).addTo(m)}
    const seen={};
    P.forEach(x=>{const key=x.p.join();if(x.home&&seen[key])return;seen[key]=1;
      const html=x.home?`<div class="pin home">${ico("airbnb",16)}</div>`:`<div class="pin">${x.num}</div>`;
      const mk=L.marker(x.p,{icon:L.divIcon({className:"pinwrap",html,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(m);
      mk.bindPopup(`<b>${esc(x.t)}</b><br><button class="btn sm pbtn" data-pr>rota até aqui</button>`);
      mk.on("popupopen",ev=>{const b=ev.popup.getElement().querySelector("[data-pr]");if(b)b.onclick=()=>{m.closePopup();routeSheet(c,x.it||{home:1},prevStop(day,day.items.indexOf(x.it)))}})});
    m.fitBounds(P.map(x=>x.p),{padding:[34,34]});setTimeout(()=>m.invalidateSize(),80);
    const link="https://www.google.com/maps/dir/?api=1&travelmode=walking&origin="+enc(P[0].p.join(","))+"&destination="+enc(P[P.length-1].p.join(","))+(P.length>2?"&waypoints="+P.slice(1,-1).slice(0,8).map(x=>enc(x.p.join(","))).join("%7C"):"");
    box.insertAdjacentHTML("beforeend",`<div class="acts" style="margin:8px 12px 12px"><a class="btn sm" href="${link}" target="_blank" rel="noopener">abrir no google maps ↗</a></div>`)};
  $("#mapd").ontoggle=e=>{store.set("mapa",e.target.open);if(e.target.open)dayMap()};if($("#mapd").open)dayMap();
  document.querySelectorAll("[data-wk],[data-wkb]").forEach(el=>{const i=+(el.dataset.wk??el.dataset.wkb),it=day.items[i];
    wiki(it).then(r=>{if(!el.isConnected)return;if(r)el.src=r.src;else if(el.dataset.wk!=null){const d=document.createElement("div");d.className="th tile ja";d.textContent=tileTxt(it);el.replaceWith(d)}else el.remove()})});
  const cur=document.querySelector('.dchip[aria-current="true"]');if(cur)cur.scrollIntoView({inline:"center",block:"nearest"});

  function row(cls,inner,mark){return `<li class="row"><div class="rail"><div class="dot ${cls}">${mark}</div></div><div>${inner}</div></li>`}
  function note(s){return `<li class="row note"><div class="rail"></div><div class="body">${esc(s)}</div></li>`}
  function legRow(l){return `<li class="row leg"><div class="rail">${legRail(l)}</div><div class="body">${legBody(l)}</div></li>`}
  function thumb(i,it){const src=photoOf(ek(it),it);
    if(src)return `<img class="th" src="${esc(src)}" alt="" loading="lazy">`;
    if(waiting(it))return `<img class="th" data-wk="${i}" alt="">`;
    return `<div class="th tile ja" aria-hidden="true">${tileTxt(it)}</div>`}
  function big(i,it,credit){const k=ek(it),src=photoOf(k,it),w=!photos[k]&&!ED.fotos[k]&&!it.img?wikiOf(it):null;
    if(src)return `<div class="phwrap"><img class="ph" src="${esc(src)}" alt=""><button class="phcam" data-ph="${i}" aria-label="Trocar foto">${ICON.cam}</button></div>${credit&&w?`<a class="credit" href="${w.url}" target="_blank" rel="noopener">Foto: Wikipedia</a>`:""}`;
    if(waiting(it))return `<div class="phwrap"><img class="ph" data-wkb="${i}" alt=""><button class="phcam" data-ph="${i}" aria-label="Trocar foto">${ICON.cam}</button></div>`;
    return it.home?"":`<button class="btn sm addph" data-ph="${i}">${ICON.cam} Adicionar foto</button>`}
  function detail(it,i,isDone){let gn=0;
    return `<div class="detail">${big(i,it,true)}${it.ja?`<p class="ja muted">${esc(it.ja)}</p>`:""}${it.note?`<p>${esc(it.note)}</p>`:""}${it.fee?`<p>Ingresso: ${esc(it.fee)}</p>`:""}
     ${(it.links||[]).map(([l,u])=>`<p><a href="${u}" target="_blank" rel="noopener">${esc(l)} ↗</a></p>`).join("")}
     <div class="acts"><button class="btn sm" data-r="${i}">Ir</button>${it.home?`<button class="btn sm" data-h>${ico("airbnb",16)} hospedagem</button>`:""}
      <a class="btn sm" href="${seeURL(it)}" target="_blank" rel="noopener">Fotos</a>
      <button class="btn sm" data-ja="${i}">${c.lang}</button>
      <button class="btn sm" data-g="${i}">Guia${(gn=gCount(guideData(c,it,ek(it))))?` <span class="cnt">${gn}</span>`:""}</button>
      <button class="btn sm" data-d="${i}">${isDone?"Desfazer":"Feito"}</button>${view.edit?`<button class="btn sm" data-ed="${i}">${ICON.pen} editar</button>`:""}</div></div>`;
  }
}

function showJa(it){
  const o=$("#jaov");o.className="jaov";
  if(it.home&&!addr()){
    o.innerHTML=`<div><div class="small" style="margin:0 0 14px">O endereço da hospedagem fica salvo só neste aparelho.</div>
     <input id="addr" class="field" placeholder="Cole o endereço da hospedagem" autocomplete="off">
     <div class="acts" style="justify-content:center"><button class="btn go" id="addok">Salvar</button><button class="btn" id="jac">Fechar</button></div></div>`;
    o.hidden=false;$("#addr").focus();o.onclick=null;
    $("#addok").onclick=()=>{const v=$("#addr").value.trim();if(v){try{localStorage.setItem("endereco-"+C().id,v)}catch(e){}}o.hidden=true;if(v)showJa(it)};
    $("#jac").onclick=()=>{o.hidden=true};return;
  }
  o.innerHTML=`<div><div class="big">${esc(it.home?addr():(it.ja||it.n))}</div><div class="small">${esc(it.home?C().home.n:it.n)}</div>
   <button class="btn close" id="jac">Fechar</button></div>`;
  o.hidden=false;$("#jac").focus();
  o.onclick=()=>{o.hidden=true};
}

/* gestos: arrastar para o lado troca o dia */
let sx=0,sy=0;
document.addEventListener("touchstart",e=>{if(!view.city||!$("#jaov").hidden||!$("#ov2").hidden||e.target.closest(".days,.mapbox,.vids,#mapreal"))return sx=null;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{if(!view.city||sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dy)<45){const nd=view.day+(dx<0?1:-1);if(nd>=0&&nd<view.city.days.length){view.day=nd;view.open=null;city();scrollTo(0,0)}}},{passive:true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#jaov").hidden=true;$("#jaov").className="jaov"}});

/* carrega dados sempre frescos, sem cache, e checa atualizações ao voltar para o app */
window.addEventListener("error",e=>{try{toast("erro no app: "+(e.message||"desconhecido"))}catch(x){}});
window.addEventListener("unhandledrejection",e=>{try{toast("erro no app: "+((e.reason&&e.reason.message)||e.reason||"desconhecido"))}catch(x){}});
applyTheme();
function loadData(){return fetch("dados.js?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{DATA_TEXT=t;const sc=document.createElement("script");sc.textContent=t;document.head.appendChild(sc)})
  .catch(()=>new Promise(res=>{const sc=document.createElement("script");sc.src="dados.js";sc.onload=res;sc.onerror=res;document.head.appendChild(sc)}))}
const sig=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return t.length+":"+h};
let updating=false;
async function autoUpdate(first){
  if(updating)return;updating=true;
  try{const [a,b]=await Promise.all([fetch("index.html?v="+Date.now(),{cache:"no-store"}).then(r=>r.text()),fetch("dados.js?v="+Date.now(),{cache:"no-store"}).then(r=>r.text())]);
    const now=sig(a)+"|"+sig(b),old=store.get("ver");
    if(!old){store.set("ver",now)}
    else if(old!==now){
      let tries=0;try{tries=+sessionStorage.getItem("recarga")||0}catch(e){}
      if(tries<2){store.set("ver",now);try{sessionStorage.setItem("recarga",tries+1)}catch(e){}
        if(first||($("#jaov").hidden&&$("#ov2").hidden))reloadApp();else store.set("ver",old)}
    }else{try{sessionStorage.removeItem("recarga")}catch(e){}}
  }catch(e){}
  updating=false}
setInterval(()=>{if(!document.hidden&&$("#jaov").hidden&&$("#ov2").hidden)autoUpdate()},60000);
let lastCheck=Date.now();
document.addEventListener("visibilitychange",async()=>{if(document.hidden||Date.now()-lastCheck<20000)return;lastCheck=Date.now();
  const before=ED_TEXT;await loadEd();if(ED_TEXT!==before&&$("#jaov").hidden&&$("#ov2").hidden)rerender();flushLocal();
  autoUpdate()});
Promise.all([loadData(),DB.load(),loadEd()]).then(function(){
  const today=jstToday(),h=location.hash.slice(1);
  const c=TRIP.cities.find(c=>c.days&&c.days.some(d=>d.d===today));
  if(c){CUR=VIAGENS()[0];openCity(c.id)}
  else if(h&&TRIP.cities.some(x=>x.id===h&&x.days)){CUR=VIAGENS()[0];openCity(h)}
  else if(h&&VIAGENS().some(t=>t.id===h))openTrip(h);else trips();
  if(location.search)try{history.replaceState(null,"",location.pathname+location.hash)}catch(e){}
  initFirebase();autoUpdate(true);
});
</script>

</body>
